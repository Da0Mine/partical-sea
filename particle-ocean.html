<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>粒子海洋 · Particle Ocean</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #app { position: fixed; inset: 0; display: block; cursor: grab; }
  #app.grabbing { cursor: grabbing; }
  #loading {
    position: fixed; inset: 0; z-index: 20; display: flex;
    align-items: center; justify-content: center;
    color: #aab4e8; font-family: system-ui, sans-serif; letter-spacing: 3px;
    background: #000; transition: opacity 0.8s ease;
  }
  .tools { position: fixed; top: 20px; right: 20px; z-index: 15; display: flex; gap: 10px; align-items: flex-start; font-family: system-ui, "PingFang SC", sans-serif; }
  .tool-btn {
    background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.85);
    border: 1px solid rgba(255,255,255,0.22); padding: 8px; border-radius: 9px;
    cursor: pointer; backdrop-filter: blur(4px); user-select: none;
    display: flex; align-items: center; justify-content: center; width: 36px; height: 36px;
  }
  .tool-btn svg { display: block; }
  .tool-btn.active { background: rgba(127,216,255,0.18); border-color: rgba(127,216,255,0.55); color: #cdefff; }
  /* 第一人称准心 */
  #reticle {
    position: fixed; left: 50%; top: 50%; width: 20px; height: 20px;
    transform: translate(-50%, -50%); z-index: 12; display: none; pointer-events: none;
  }
  #reticle::before, #reticle::after { content: ''; position: absolute; background: rgba(255,255,255,0.85); box-shadow: 0 0 3px rgba(0,0,0,0.6); }
  #reticle::before { left: 50%; top: 0; width: 1.5px; height: 100%; transform: translateX(-50%); }
  #reticle::after { top: 50%; left: 0; height: 1.5px; width: 100%; transform: translateY(-50%); }
  #collectTag {
    position: fixed; top: 18px; left: 18px; z-index: 12;
    color: #ffe9a8; font-family: system-ui, "PingFang SC", sans-serif; font-size: 17px; letter-spacing: 1px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
  }
  #collectTag .ball {
    display: inline-block; width: 15px; height: 15px; border-radius: 50%;
    background: radial-gradient(circle at 35% 28%, #ffffff, #c3cfe4 62%, #7f8da6 100%);
    vertical-align: -2px; box-shadow: 0 0 7px rgba(255,255,255,0.45);
  }
  #collectTag.pop .ball { animation: ballPop .4s ease; }
  @keyframes ballPop {
    0% { transform: scale(1); }
    35% { transform: scale(1.6); }
    100% { transform: scale(1); }
  }
  #settingsPanel {
    position: fixed; top: 58px; right: 14px; z-index: 15;
    width: 254px; padding: 14px 18px;
    max-height: 74vh; overflow-y: auto;
    background: rgba(8,12,26,0.9); border: 1px solid rgba(127,216,255,0.3);
    border-radius: 12px; font-size: 13px; font-family: system-ui, "PingFang SC", sans-serif;
    color: #dfe8ff;
  }
  #settingsPanel label { display: flex; justify-content: space-between; align-items: center; margin: 8px 0 4px; }
  #settingsPanel label.chk { justify-content: flex-start; gap: 8px; }
  #eventTag {
    position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 13;
    color: #ffd9d0; font-family: system-ui, "PingFang SC", sans-serif; font-size: 15px; letter-spacing: 3px;
    background: rgba(60,14,10,0.55); padding: 7px 18px; border-radius: 9px;
    border: 1px solid rgba(255,140,110,0.45); display: none; pointer-events: none; white-space: nowrap;
  }
  .panel-row { display: flex; gap: 8px; margin-top: 15px; }
  .panel-btn {
    flex: 1; padding: 7px 0; font-size: 12px; cursor: pointer; font-family: inherit;
    color: #dfe6ff; background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.22); border-radius: 8px;
  }
  .panel-btn:hover { background: rgba(127,216,255,0.18); border-color: rgba(127,216,255,0.5); }
  .panel-btn.danger { color: #ffd9d0; border-color: rgba(255,140,110,0.45); }
  .panel-btn.danger:hover { background: rgba(255,120,90,0.22); border-color: rgba(255,150,120,0.7); }
  .tool-btn.off { opacity: 0.4; }
  .tool-btn.off .wave1, .tool-btn.off .wave2 { display: none; }
  .tool-btn.off .slash { display: block !important; }
</style>
</head>
<body>
  <canvas id="app"></canvas>
  <div class="tools">
    <div class="view-btn tool-btn" id="viewBtn" title="视角：环绕（点击切换第一人称飞行）">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    </div>
    <div class="tool-btn" id="fullBtn" title="全屏">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"></path>
      </svg>
    </div>
    <div class="tool-btn" id="settingsBtn" title="设置">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </div>
  </div>
  <div id="reticle"></div>
  <div id="eventTag"></div>
  <div id="collectTag"><span class="ball"></span> × 0</div>
  <div id="loading">LOADING…</div>
  <div id="settingsPanel" style="display:none">
    <label class="chk"><input type="checkbox" id="sndChk" checked> 音效</label>
    <div class="panel-row">
      <button id="btnBig" class="panel-btn">召唤巨浪</button>
      <button id="btnTsu" class="panel-btn danger">召唤海啸</button>
    </div>
    <div class="panel-row">
      <button id="btnTor" class="panel-btn danger">召唤龙卷风</button>
    </div>
  </div>

  <script>
  (function () {
    try {
      const canvas = document.getElementById('app');
      const ctx = canvas.getContext('2d');
      let W = 0, H = 0, cx = 0, cy = 0, dpr = 1, bgGrad = null;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 1.75);
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = W * dpr; canvas.height = H * dpr;
        canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cx = W / 2; cy = H / 2;
        bgGrad = ctx.createLinearGradient(0, 0, 0, H);
        bgGrad.addColorStop(0.0, '#000000');
        bgGrad.addColorStop(0.45, '#000000');
        bgGrad.addColorStop(0.75, '#000000');
        bgGrad.addColorStop(1.0, '#000000');
      }
      window.addEventListener('resize', resize);
      resize();

      // ---------- 常量与状态 ----------
      let AMP = 4.2;
      let OCEAN = 200;          // 渲染范围（海面边长）
      let GRID = 130;           // 粒子密度（每边粒子数）
      let COUNT = GRID * GRID;
      let baseX = new Float32Array(COUNT);
      let baseZ = new Float32Array(COUNT);
      let baseFog = new Float32Array(COUNT);   // 每粒子雾化系数（FPV 远处变暗，orbit 下恒为 1）
      let projX = new Float32Array(COUNT);
      let projY = new Float32Array(COUNT);
      let projS = new Float32Array(COUNT);
      let projV = new Uint8Array(COUNT);
      let projA = new Float32Array(COUNT);   // 每粒子最终 alpha（含 FPV 近处浪墙屏障增强）
      const bucketCols = [];
      const bucketA = [];
      for (let b = 0; b < 24; b++) {
        const t = b / 23;
        const a = 0.22 + t * 0.55;
        bucketCols.push('rgba(255,255,255,' + a.toFixed(3) + ')');
        bucketA.push(a);
      }

      let G = 26, SPRING_K = 22, SPRING_C = 3.2, WATER_C = 3.5; const RIPPLE_SPEED = 16;
      const FREEFALL_GAP = 5;   // 物体高于水面超过此距离才受自由落体重力；贴近水面用阻尼弹簧轻轻回位，避免“硬落地”反弹溅水
      let rippleScale = 1;
      const splashes = [];
      const ripples = [];
      let curT = 0, lastFrame = performance.now();
      let curCosY = 1, curSinY = 0, curCosP = 1, curSinP = 0;
      let curCosR = 1, curSinR = 0;   // 视角横滚（游泳时随波浪左右摇晃）

      // ---------- 随机海况：大浪与海啸 ----------
      // 一道沿 (dx,dz) 推进的浪涌，前陡后缓。高度直接叠加进 waveHeightBase，
      // 所以渲染、波面遮挡、物体浮力、游泳体感会同时感受到它。
      const surges = [];
      const tornados = [];                          // 龙卷风：稀有事件
      let nextBigT = 22 + Math.random() * 30;      // 下一次大浪
      let nextRareT = 90 + Math.random() * 130;     // 下一次稀有事件（海啸 / 超大海啸 / 龙卷风）
      const pushTmp = { x: 0, z: 0 };

      // 海况：普通大浪（随机刷新）/ 巨浪（手动召唤）/ 海啸（灾难级）/ 超大海啸（海啸 3 倍）
      // 浪高直接叠加进波函数，所以浪本身就是一堵会推进的水墙，会把人和物体一起推走。
      const SURGE_KIND = {
        big:     { amp: AMP * 1.15 + 3.5, width: 16, speed: 28, dist: 320, msg: '大浪来袭' },
        huge:    { amp: AMP * 2.6 + 11,   width: 26, speed: 44, dist: 420, msg: '巨 浪 来 袭' },
        tsunami: { amp: AMP * 4.6 + 22,   width: 44, speed: 62, dist: 580, msg: '海 啸 来 袭' },
        mega:    { amp: (AMP * 4.6 + 22) * 3, width: 96, speed: 84, dist: 860, msg: '超 大 海 啸 来 袭' }
      };
      function spawnSurge(kind) {
        const cfg = SURGE_KIND[kind] || SURGE_KIND.big;
        const ang = Math.random() * 6.2832;
        const dx = Math.cos(ang), dz = Math.sin(ang);
        surges.push({
          kind, dx, dz,
          p0: (camX * dx + camZ * dz) - cfg.dist,   // 从玩家身后沿传播方向打来
          t0: curT,
          speed: cfg.speed,
          amp: cfg.amp,
          width: cfg.width
        });
        showEvent(cfg.msg);
      }

      function surgeHeight(x, z, t) {
        let h = 0;
        for (let i = 0; i < surges.length; i++) {
          const sg = surges[i];
          const u = (x * sg.dx + z * sg.dz - (sg.p0 + sg.speed * (t - sg.t0))) / sg.width;
          if (u < -2.4 || u > 2.4) continue;
          h += sg.amp * Math.exp(-u * u * (u > 0 ? 1.8 : 0.5));   // 迎面陡、背面缓
        }
        return h;
      }

      // 浪涌对水中物体的水平推力（海啸会把漂浮物整个推走）
      function surgePush(px, pz) {
        pushTmp.x = 0; pushTmp.z = 0;
        for (let i = 0; i < surges.length; i++) {
          const sg = surges[i];
          const u = (px * sg.dx + pz * sg.dz - (sg.p0 + sg.speed * (curT - sg.t0))) / sg.width;
          if (u < -2.2 || u > 2.2) continue;
          const push = sg.amp * (sg.kind === 'mega' ? 5.0 : sg.kind === 'tsunami' ? 3.6 : sg.kind === 'huge' ? 2.2 : 1.1) * Math.exp(-u * u);
          pushTmp.x += sg.dx * push; pushTmp.z += sg.dz * push;
        }
        return pushTmp;
      }

      function updateSurges(dt) {
        if (curT > nextBigT) { spawnSurge('big'); nextBigT = curT + 32 + Math.random() * 46; }
        // 稀有事件：海啸 / 超大海啸 / 龙卷风。同一时间只出现一种（场上还有稀有事件就顺延）
        const rareActive = surges.some(sg => sg.kind === 'tsunami' || sg.kind === 'mega')
          || tornados.length > 0;
        if (curT > nextRareT && !rareActive) {
          const r = Math.random();
          if (r < 0.30) spawnSurge('mega');       // 超大海啸：约 30% 概率
          else if (r < 0.58) spawnSurge('tsunami');
          else spawnTornado();                    // 龙卷风
          nextRareT = curT + 80 + Math.random() * 140;
        }
        for (let i = surges.length - 1; i >= 0; i--) {
          const sg = surges[i];
          const front = sg.p0 + sg.speed * (curT - sg.t0);
          if (front - (camX * sg.dx + camZ * sg.dz) > sg.width * 3 + 260) surges.splice(i, 1);
        }
        updateTornados(dt);
      }

      // ---------- 龙卷风：巨型旋转风柱，把附近的人和物体卷上天 ----------
      // 生成后固定在世界坐标不再移动；大小远超大楼；出场由小到大，带旋转粒子与海面水雾。
      // 风柱里还卷着一批「从海里被吸出来」的方块碎片：绕中轴高速旋转、螺旋上升，到顶被甩出去。
      // 玩家被卷起时不做高度限制，而是越转越高、旋转半径越来越大，到约大楼三倍高被甩飞出去。
      const TORNADO_EJECT_H = 500;
      function resetDebris(d, td) {
        d.ang = Math.random() * 6.2832;
        d.h = -8 - Math.random() * 16;             // 从水面以下开始 → 视觉上就是「被从海里吸出来」
        d.rad = td.r * (0.85 + Math.random() * 0.5);
        d.spin = 2.8 + Math.random() * 2.6;        // 绕中轴角速度（快速旋转）
        d.rise = 10 + Math.random() * 14;          // 上升速度
        d.size = 1.4 + Math.random() * 2.4;
        d.rx = Math.random() * 6.28; d.ry = Math.random() * 6.28;
        d.sx = (Math.random() - 0.5) * 6; d.sy = (Math.random() - 0.5) * 6;
        return d;
      }
      function debrisToFloater(td, d, vx, vy, vz) {
        floaters.push({
          type: 'box', sc: Math.max(0.55, d.size * 0.45),
          x: td.x + Math.cos(d.ang) * d.rad, z: td.z + Math.sin(d.ang) * d.rad,
          y: waveHeight(td.x, td.z, curT) + d.h,
          vx, vy, vz,
          rx: d.rx, ry: d.ry,
          sx: (Math.random() - 0.5) * 0.8, sy: (Math.random() - 0.5) * 0.8,
          state: 'free', wasSub: false, hover: false, flash: 0
        });
      }
      // 卷到顶端 → 沿切线甩出去，落回海里（只有一部分变成真实漂浮物，避免刷屏）
      function ejectDebris(td, d) {
        if (Math.random() > 0.4) return;
        const tanX = -Math.sin(d.ang), tanZ = Math.cos(d.ang);
        const sp = 16 + Math.random() * 12;
        debrisToFloater(td, d, tanX * sp + Math.cos(d.ang) * 9, 6 + Math.random() * 6,
          tanZ * sp + Math.sin(d.ang) * 9);
      }
      // 龙卷风消散：被卷上天的一起掉回海里
      function dropDebris(td) {
        for (const d of td.debris) {
          if (d.h < 0) continue;
          debrisToFloater(td, d, Math.cos(d.ang) * 10, -2, Math.sin(d.ang) * 10);
        }
        td.debris.length = 0;
      }
      function spawnTornado() {
        const ang = Math.random() * 6.2832;
        // 生成距离要略大于风柱半径，免得玩家一出现就被堵在风眼里
        const dist = 130 + Math.random() * 80;     // 在玩家周围固定位置出现
        const td = {
          x: camX + Math.cos(ang) * dist,
          z: camZ + Math.sin(ang) * dist,
          t0: curT, life: 45,
          height: 760,                             // 比大楼（110~220）高得多
          r: 116,                                  // 风柱半径（吸附半径，比原来大一倍）
          debris: []
        };
        for (let i = 0; i < 22; i++) td.debris.push(resetDebris({}, td));
        tornados.push(td);
        showEvent('龙 卷 风 来 袭');
      }
      function updateTornados(dt) {
        for (let i = tornados.length - 1; i >= 0; i--) {
          const td = tornados[i];
          const age = curT - td.t0;
          if (age > td.life) { dropDebris(td); tornados.splice(i, 1); continue; }
          const grow = Math.min(1, age / 2.5);     // 出场过渡：由小到大
          const R = td.r * grow;
          // 风柱里的方块碎片：绕中轴高速旋转 + 螺旋上升；出水后沿漏斗收拢，越往上张得越开
          const Hd = td.height * grow;
          for (const d of td.debris) {
            const t = Math.max(0, Math.min(1, d.h / Hd));
            if (d.h >= 0) {
              const targetR = R * (0.16 + 0.84 * t) + 2;
              d.rad += (targetR - d.rad) * Math.min(1, dt * 1.6);
            }
            d.ang += d.spin * (1 + (1 - t) * 0.8) * dt;      // 越靠底部转得越快
            d.h += d.rise * (0.5 + t * 0.9) * dt;
            d.rx += d.sx * dt; d.ry += d.sy * dt;
            if (d.h > Hd) { ejectDebris(td, d); resetDebris(d, td); }
          }
          // 卷起附近的漂浮物：向心 + 强切向（明显绕圈）+ 上升，越近卷得越猛
          for (const f of floaters) {
            if (f.type === 'ruin' || f.type === 'boat') continue;
            const dx = f.x - td.x, dz = f.z - td.z;   // 由风柱中心指向物体
            const d = Math.hypot(dx, dz);
            if (d < R && d > 0.01) {
              const k = 1 - d / R;                 // 越靠近风柱中心越强
              const inward = k * 70;               // 向心：被吸进风柱
              const swirl = Math.min(k * 95, d * 2.6);   // 切向：绕着龙卷风打转（靠近风眼不失控）
              f.x += (-dx / d * inward - dz / d * swirl) * dt;
              f.z += (-dz / d * inward + dx / d * swirl) * dt;
              // 杂物也有高度上限，卷到风柱上部就停在那儿盘旋，不会飞出天际
              const objTop = waveHeight(td.x, td.z, curT) + td.height * 0.7;
              if (f.y < objTop) {
                f.y += k * 100 * dt;
                f.vy = Math.max(f.vy, 16);         // 一直被往上抛
              }
            }
          }
          // 玩家：被慢慢吸向风柱，同时绕着它旋转上升；视角叠加旋转但玩家可以自由转头
          if (camMode === 'fpv') {
            const dx = camX - td.x, dz = camZ - td.z;
            const d = Math.hypot(dx, dz);
            if (d < R && d > 0.01) {
              const k = 1 - d / R;
              const swim = camState === 'swim';
              // 越被卷得越高，向心力越弱并逐渐转为离心 → 旋转半径越来越大
              const lift = camY - (waveHeight(td.x, td.z, curT) + SWIM_EYE_H);
              const tH = Math.min(1, Math.max(0, lift / TORNADO_EJECT_H));
              // 旋转半径随高度张开：低空贴着风眼转，越卷越高被甩得越外圈
              const targetR = R * (swim ? 0.12 + 0.7 * tH : 0.15 + 0.35 * tH);
              const radial = (targetR - d) * 1.3;               // 正=往外推，负=往里吸
              // 越被卷得越高转得越快：切向速度随高度显著递增
              const swirl = Math.min((swim ? 74 : 38) * (0.35 + 0.65 * k) * (1 + 2.2 * tH), d * 3.4);
              camX += (dx / d * radial - dz / d * swirl) * dt;
              camZ += (dz / d * radial + dx / d * swirl) * dt;
              // 视角只是叠加旋转，不锁死：玩家仍可用鼠标自由看四周
              const swirlYaw = k * (swim ? 0.8 : 0.45) * dt;
              yawT += swirlYaw; yaw += swirlYaw;
              if (swim) {
                standY = -1e9;                     // 被卷起时脱离楼顶支撑
                if (lift < TORNADO_EJECT_H) {
                  td.ejected = false;              // 掉回高度以下 → 可以再被卷上去一次
                  camY += (0.45 + 0.55 * k) * 52 * dt;   // 不限高，越卷越高
                  swimVy = Math.max(swimVy, 5);
                } else if (!td.ejected) {
                  // 卷到约大楼三倍高 → 沿切线 + 向外甩飞出去，之后自由落体。
                  // 甩出速度与风柱里杂物被卷动的速度一致（向心 70 / 切向 95），所以能飞很远
                  td.ejected = true;
                  swimVX = (dx / d) * 70 + (-dz / d) * 95;
                  swimVZ = (dz / d) * 70 + (dx / d) * 95;
                  swimVy = 8;
                }
                swimOff = camY - (waveHeight(camX, camZ, curT) + SWIM_EYE_H);
                camVy = swimVy;
              }
            }
          }
        }
      }

      // ---------- 波函数（叠加飞溅涟漪） ----------
      // 基波（4 条正弦叠加，无涟漪）+ 浪涌：用于波面高度计算与遮挡采样
      function waveHeightBase(x, z, t) {
        return Math.sin(x * 0.08 + t * 0.9) * AMP * 0.55
             + Math.sin(z * 0.12 + t * 0.7) * AMP * 0.45
             + Math.sin((x + z) * 0.06 + t * 1.15) * AMP * 0.35
             + Math.sin((x - z) * 0.10 - t * 0.6) * AMP * 0.25
             + surgeHeight(x, z, t);
      }
      function waveHeight(x, z, t) {
        let h = waveHeightBase(x, z, t);
        for (let i = 0; i < ripples.length; i++) {
          const rp = ripples[i];
          const age = t - rp.t0;
          if (age < 0) continue;
          const dx = x - rp.x, dz = z - rp.z;
          const r = Math.sqrt(dx * dx + dz * dz);
          const front = RIPPLE_SPEED * age;
          const d = front - r;
          if (d >= 0) {
            const env = Math.exp(-age * 0.7) * Math.exp(-d * 0.05) * Math.sin(d * 0.5);
            h += rp.strength * env;
          }
        }
        return h;
      }
      // 波面竖直速度（waveHeight 对 t 的解析导数，不含涟漪），用于判断物体是否“相对水面”高速穿越
      function waveVel(x, z, t) {
        return 0.9 * AMP * 0.55 * Math.cos(x * 0.08 + t * 0.9)
             + 0.7 * AMP * 0.45 * Math.cos(z * 0.12 + t * 0.7)
             + 1.15 * AMP * 0.35 * Math.cos((x + z) * 0.06 + t * 1.15)
             - 0.6 * AMP * 0.25 * Math.cos((x - z) * 0.10 - t * 0.6);
      }
      // 波面坡度（dh/dx, dh/dz，不含涟漪），用于游泳视角随波左右摇晃
      function waveSlope(x, z, t) {
        const dx = Math.cos(x * 0.08 + t * 0.9) * 0.08 * AMP * 0.55
                 + Math.cos((x + z) * 0.06 + t * 1.15) * 0.06 * AMP * 0.35
                 + Math.cos((x - z) * 0.10 - t * 0.6) * 0.10 * AMP * 0.25;
        const dz = Math.cos(z * 0.12 + t * 0.7) * 0.12 * AMP * 0.45
                 + Math.cos((x + z) * 0.06 + t * 1.15) * 0.06 * AMP * 0.35
                 - Math.cos((x - z) * 0.10 - t * 0.6) * 0.10 * AMP * 0.25;
        return { x: dx, z: dz };
      }

      // ---------- 波面不透明遮挡：连续波面 + 深度分层 + 黑色遮罩 ----------
      // 遮挡体是「连续波面」而不是离散粒子，所以没有缝隙。做法：
      // 把画面按「屏幕列 × 深度层」离散化，逐层记录波面投影高度与「更近波面」形成的遮挡边界；
      // 渲染时从远到近逐层：先用纯黑覆盖被更近波面挡住的区域，再画本层粒子与物体。
      // 于是粒子和物体都被波面逐段截断——哪里被挡住就遮住哪里，随波起伏是渐变出现而非整块弹出。
      let occCamX = 0, occCamY = 0, occCamZ = 0;   // 当前帧相机世界坐标（轨道/第一人称通用）
      const OCC_LAYERS = 40;                  // 深度层数（按到相机的距离指数分层）
      const OCC_COL_W = 8;                    // 遮挡采样列宽（像素）
      const OCC_T0 = 2, OCC_TR = 1.16;        // 最近层距离与层间倍率（近密远疏，采样更密以贴合浪形）
      const OCC_LOG_TR = Math.log(OCC_TR);
      const layerDist = new Float32Array(OCC_LAYERS);
      for (let k = 0; k < OCC_LAYERS; k++) layerDist[k] = OCC_T0 * Math.pow(OCC_TR, k);
      let occCols = 0;
      let occStrength = 0;                          // 遮挡强度：贴近水面且视线接近水平时才需要遮挡
      let occNear = new Float32Array(OCC_LAYERS);   // [k][c] 更近波面形成的地平线（屏幕 y）：低于它即被浪挡住
      let occY = new Float32Array(OCC_LAYERS);      // [k][c] 本层波面自身的投影 y
      let colDirX = new Float32Array(1), colDirZ = new Float32Array(1);
      const layerLists = [], objLayerLists = [];
      for (let k = 0; k < OCC_LAYERS; k++) { layerLists.push([]); objLayerLists.push([]); }

      // 距离 → 深度层索引
      function occLayerOf(dx, dz) {
        let bi = Math.log(Math.sqrt(dx * dx + dz * dz) / OCC_T0) / OCC_LOG_TR;
        if (!(bi >= 0)) bi = 0;                 // 距离过小 / NaN
        if (bi > OCC_LAYERS - 1) bi = OCC_LAYERS - 1;
        return bi | 0;
      }

      // 只取屏幕 y 的轻量投影：避免每步产生临时对象（遮罩每帧调用上万次）
      // 注意：不能叫 projY —— 那是粒子投影缓冲区的名字，会冲突
      function projScreenY(x, y, z) {
        const tx = x - camX, ty = y - camY, tz = z - camZ;
        const x1 = tx * curCosY + tz * curSinY;
        const z1 = -tx * curSinY + tz * curCosY;
        const y2 = ty * curCosP - z1 * curSinP;
        const z2 = ty * curSinP + z1 * curCosP;
        const off = (camMode === 'fpv') ? 0 : camDist;
        const denom = off - z2;
        if (denom <= 1) return NaN;
        const yr = x1 * curSinR + y2 * curCosR;   // 含视角横滚
        return cy - yr * (fov / denom);
      }

      // 每帧计算遮挡表：每列的水平视线方向 + 各层波面投影 y，再由近到远累积出遮挡边界
      function computeOcclusion() {
        const need = Math.max(1, Math.ceil(W / OCC_COL_W));
        if (occCols !== need) {
          occCols = need;
          occNear = new Float32Array(need * OCC_LAYERS);
          occY = new Float32Array(need * OCC_LAYERS);
          colDirX = new Float32Array(need);
          colDirZ = new Float32Array(need);
        }
        const off = (camMode === 'fpv') ? 0 : camDist;
        // 遮挡强度：这种「按屏幕列累积地平线」的做法等价于体素海面渲染，只在视线接近
        // 水平、眼睛贴近水面时才成立。俯视或高空时用它会在画面上挖出成片的黑洞，
        // 所以按「眼睛离水面的高度」和「俯仰角」把地平线平滑压到屏幕底部（= 不遮挡）。
        const eyeAbove = camY - waveHeight(camX, camZ, curT);
        // 潜到水面以下时这套遮挡模型不成立（水面在你头顶，不会挡住你看海底），
        // 必须淡出遮挡，否则整个视野会被波面黑幕盖住、潜下去一片全黑。
        let s = (eyeAbove >= 0)
          ? 1 - (eyeAbove - 4) / 20                            // 水上：4 以内全遮挡，24 以上不遮挡
          : 1 + eyeAbove / 1.5;                                // 入水后 1.5 单位内快速淡出
        if (s < 0) s = 0; else if (s > 1) s = 1;
        const ap = pitch < 0 ? -pitch : pitch;
        let pf = 1 - (ap - 0.5) / 0.7;                         // 0.5rad 内全遮挡，1.2rad 以上不遮挡
        if (pf < 0) pf = 0; else if (pf > 1) pf = 1;
        occStrength = s * pf;

        // 每列的水平视线方向（屏幕 x + 两个深度反投影，orbit / FPV 通用）
        for (let c = 0; c < need; c++) {
          const sx = c * OCC_COL_W + OCC_COL_W * 0.5;
          const p1 = unproject(sx, cy, off - 500);
          const p2 = unproject(sx, cy, off - 1500);
          let vx = p2.x - p1.x, vz = p2.z - p1.z;
          const vl = Math.hypot(vx, vz);
          if (vl < 1e-6) { colDirX[c] = 0; colDirZ[c] = 0; continue; }
          colDirX[c] = vx / vl; colDirZ[c] = vz / vl;
        }
        for (let c = 0; c < need; c++) {
          const vx = colDirX[c], vz = colDirZ[c];
          let m = H;
          for (let k = 0; k < OCC_LAYERS; k++) {
            const idx = k * need + c;
            let y = H;
            if (vx !== 0 || vz !== 0) {
              const d = layerDist[k];
              const px = occCamX + vx * d, pz = occCamZ + vz * d;
              const py = projScreenY(px, waveHeightBase(px, pz, curT), pz);
              if (isFinite(py)) y = py;
            }
            occY[idx] = y;
            occNear[idx] = m;          // 本层遮挡边界 = 更近层（0..k-1）波面的最高点
            if (y < m) m = y;          // 波面更高（屏幕更靠上）→ 抬升遮挡边界
          }
        }
      }

      // 实际使用的地平线：occStrength 越小越往下压，直到完全不裁剪
      function occHorizon(idx) {
        const y0 = occNear[idx];
        return y0 + (1 - occStrength) * (H - y0);
      }

      // 用「波面地平线」裁剪：地平线以下（被更近的浪挡住的部分）直接不绘制。
      // 注意裁剪区横跨整个屏幕宽度——若只覆盖物体估算的包围盒，物体的边角会被切掉。
      function clipToHorizon(row) {
        const top = -200;
        ctx.beginPath();
        ctx.moveTo(0, top);
        ctx.lineTo(W, top);
        ctx.lineTo(W, occHorizon(row + occCols - 1));
        for (let c = occCols - 1; c >= 0; c--) ctx.lineTo(c * OCC_COL_W, occHorizon(row + c));
        ctx.lineTo(0, occHorizon(row));
        ctx.closePath();
        ctx.clip();
      }

      // ---------- 构建粒子 ----------
      function buildParticles(grid, ocean) {
        GRID = grid; OCEAN = ocean; COUNT = GRID * GRID;
        baseX = new Float32Array(COUNT);
        baseZ = new Float32Array(COUNT);
        baseFog = new Float32Array(COUNT).fill(1);
        projX = new Float32Array(COUNT);
        projY = new Float32Array(COUNT);
        projS = new Float32Array(COUNT);
        projV = new Uint8Array(COUNT);
        projA = new Float32Array(COUNT);
        const half = OCEAN / 2, step = OCEAN / (GRID - 1);
        let p = 0;
        for (let i = 0; i < GRID; i++) {
          for (let j = 0; j < GRID; j++) {
            baseX[p] = -half + i * step;
            baseZ[p] = -half + j * step;
            p++;
          }
        }
      }
      buildParticles(GRID, OCEAN);

      // ---------- 第一人称的“无限画布”：统一粒子场，无分层，仅按距离线性淡出 ----------
      // 全场景同一种间距（不分层、无密度跳变）；离相机越远越淡，亮度衰减到 0 的点直接不渲染
      const FPV_RADIUS = 300;           // 统一渲染半径（超出该范围不生成粒子）
      const FPV_FADE_START = 0.15;      // 从该比例半径处开始淡出（更早开始）
      const FPV_FADE_POW = 1.9;         // 淡出曲线指数（>1 → 远处亮度衰减更快）
      const FPV_STEP_MUL = 2.2;         // 统一间距 = 基准间距 × 该倍率
      const FPV_REBUILD_DIST = 6;       // 相机移动超过该距离才重建粒子场（边缘已淡到 0，重建无感）
      function buildFPVParticles(cx0, cz0) {
        const baseStep = OCEAN / (GRID - 1);
        const step = Math.max(baseStep * FPV_STEP_MUL, 1.6);
        const startX = Math.floor((cx0 - FPV_RADIUS) / step) * step;
        const startZ = Math.floor((cz0 - FPV_RADIUS) / step) * step;
        const fade0 = FPV_RADIUS * FPV_FADE_START;
        const fadeW = FPV_RADIUS - fade0;
        const xs = [], zs = [], fg = [];
        for (let x = startX; x <= cx0 + FPV_RADIUS; x += step) {
          for (let z = startZ; z <= cz0 + FPV_RADIUS; z += step) {
            const d = Math.hypot(x - cx0, z - cz0);
            if (d > FPV_RADIUS) continue;
            let f = 1;
            if (d > fade0) f = Math.pow(Math.max(0, 1 - (d - fade0) / fadeW), FPV_FADE_POW);   // 快速淡出到 0
            xs.push(x); zs.push(z); fg.push(f);
          }
        }
        COUNT = xs.length;
        baseX = Float32Array.from(xs);
        baseZ = Float32Array.from(zs);
        baseFog = Float32Array.from(fg);
        projX = new Float32Array(COUNT);
        projY = new Float32Array(COUNT);
        projS = new Float32Array(COUNT);
        projV = new Uint8Array(COUNT);
        projA = new Float32Array(COUNT);
      }

      // ---------- 漂浮几何体 ----------
      const palette = [[255,255,255]];
      // 球体不再是普通漂浮物，而是需要收集的战利品（低概率出现、点击收集）
      const types = ['box', 'cuboid', 'tetra', 'star', 'pyramid', 'octa', 'diamond'];
      let floaters = [];
      let objTarget = 22;              // 目标物体数量（跟随调试滑块）
      function buildFloaters(num) {
        objTarget = num;
        floaters = [];
        for (let k = 0; k < num; k++) {
          const type = types[(Math.random() * types.length) | 0];
          const sc = 0.7 + Math.random() * 0.8;
          const x = (Math.random() - 0.5) * OCEAN * 0.82;
          const z = (Math.random() - 0.5) * OCEAN * 0.82;
          floaters.push({
            type, sc, x, z,
            y: -(6 + Math.random() * 9), vx: 0, vy: 0, vz: 0,   // 从水底浮出，更自然
            rx: Math.random() * 6.28, ry: Math.random() * 6.28,
            rx: Math.random() * 6.28, ry: Math.random() * 6.28,
            sx: (Math.random() - 0.5) * 0.5, sy: (Math.random() - 0.5) * 0.4,
            state: 'free', wasSub: false, hover: false, flash: 0
          });
        }
      }
      buildFloaters(22);

      // 第一人称物体流式渲染：跟随相机半径生成，超出半径删除（释放内存）
      // 遗迹与漂浮物一样流式：跟随相机随机生成、超出「遗迹半径」即释放内存（遗迹更大，半径也更远）
      function streamFloaters(cx0, cz0) {
        for (let i = floaters.length - 1; i >= 0; i--) {
          const f = floaters[i];
          if (f === dragging) continue;                       // 正在拖拽的物体不删
          if (f === boat && driving) continue;                // 正在驾驶的木筏不删
          const lim = f.type === 'ruin' ? RUIN_R : FPV_OBJ_R;
          if (Math.hypot(f.x - cx0, f.z - cz0) > lim) floaters.splice(i, 1);
        }
        let guard = 0;
        while (floaters.filter(f => !f.collectible).length < objTarget && guard++ < 24) { // 补足普通物体
          const ang = Math.random() * 6.2832;
          // 近处略密、远处渐疏：全按面积均匀的话击飞射程内几乎没东西可打
          const r = 14 + Math.pow(Math.random(), 1.4) * (FPV_OBJ_R - 14);
          const x = cx0 + Math.cos(ang) * r;
          const z = cz0 + Math.sin(ang) * r;
          let ok = true;
          for (const f of floaters) {
            if (Math.hypot(f.x - x, f.z - z) < collideR(f) + 2.0) { ok = false; break; }
          }
          if (!ok) continue;
          const type = types[(Math.random() * types.length) | 0];
          const sc = 0.7 + Math.random() * 0.8;
          floaters.push({
            type, sc, x, z,
            y: -(6 + Math.random() * 9), vx: 0, vy: 0, vz: 0,   // 从水底浮出，更自然
            rx: Math.random() * 6.28, ry: Math.random() * 6.28,
            sx: (Math.random() - 0.5) * 0.5, sy: (Math.random() - 0.5) * 0.4,
            state: 'free', wasSub: false, hover: false, flash: 0
          });
        }
        ensureRuins(cx0, cz0);   // 遗迹补足到目标数量（随机位置）
        ensureCollectibles(cx0, cz0);   // 战利品球体补足（少量、低概率出现）
      }

      // ---------- 洋流：整片海在缓慢流动，物体与玩家都会被带着走 ----------
      const CURRENT = 2.6;                 // 洋流强度（单位/秒）
      const OBJ_CURRENT = 0.9;             // 洋流对漂浮物的作用系数
      const OBJ_DRIFT = 3.0;               // 漂浮物顺坡下溜的强度
      const cur = { x: 0, z: 0 };
      function currentAt(x, z, t) {
        cur.x = Math.sin(z * 0.013 + t * 0.05) * CURRENT + Math.sin((x + z) * 0.008 - t * 0.031) * CURRENT * 0.6;
        cur.z = Math.cos(x * 0.011 - t * 0.042) * CURRENT + Math.cos((x - z) * 0.006 + t * 0.037) * CURRENT * 0.6;
        return cur;
      }

      // ---------- 海上遗迹：巨大的立方 / 长条 / 四面体，大半沉在水下，随波浪若隐若现 ----------
      const RUIN_TARGET = 3, RUIN_R = 300;
      const SEABED_Y = -1950;               // 海底：遗迹从这里一直长上来（向水下延伸极深）
      const RUIN_MAX_TILT = 0.3;            // 遗迹最大倾角（超过这个坡度爬不上去，会滑下来）
      const CLIMB_REACH = 35;               // 贴着墙能往上爬的最大高度（要够到摩天大楼顶）
      const CLIMB_SPEED = 7;                // 攀爬速度（单位/秒）
      const JUMP_V = 16;                    // 在屋顶上按空格跳跃的向上初速

      // 遗迹的水平半尺寸（局部坐标，未旋转）
      function ruinHalf(f) {
        const s = f.sc;
        if (f.ruinShape === 'cuboid') return [s * 1.9, s * 0.7];
        if (f.ruinShape === 'tetra') return [s * 1.6, s * 1.4];
        return [s * 0.95, s * 0.95];
      }
      // 顶面截面（局部 XZ 多边形）
      function ruinSection(f) {
        const [hx, hz] = ruinHalf(f);
        if (f.ruinShape === 'tetra') return [[hx, 0], [-hx * 0.5, hz], [-hx * 0.5, -hz]];
        return [[hx, hz], [hx, -hz], [-hx, -hz], [-hx, hz]];
      }
      // 世界偏移 → 遗迹局部坐标（rotVec 的 yaw 逆变换）
      function ruinToLocal(f, dx, dz) {
        const cy = Math.cos(f.ry), sy = Math.sin(f.ry);
        return [dx * cy - dz * sy, dx * sy + dz * cy];
      }
      // 遗迹局部坐标 → 世界偏移
      function ruinToWorld(f, lx, lz) {
        const cy = Math.cos(f.ry), sy = Math.sin(f.ry);
        return [lx * cy + lz * sy, -lx * sy + lz * cy];
      }
      // 顶面在局部坐标 (lx,lz) 处的世界高度：rotVec 的 pitch 只抬高/压低 z1 方向
      function ruinTopAt(f, lx, lz) {
        const cy = Math.cos(f.ry), sy = Math.sin(f.ry);
        const z1 = -lx * sy + lz * cy;
        return f.y - z1 * Math.sin(f.rx);
      }
      function countRuins() {
        let n = 0;
        for (const f of floaters) if (f.type === 'ruin') n++;
        return n;
      }
      function spawnRuin(cx0, cz0) {
        const shapes = ['box', 'cuboid', 'tetra'];
        const sc = 6 + Math.random() * 8;
        const ang = Math.random() * 6.2832;
        const r = 60 + Math.random() * (RUIN_R - 60);
        // 遗迹直入云霄：顶面高出水面 110~220 单位，从海底一路耸立到天上
        const topY = 110 + Math.random() * 110;
        floaters.push({
          type: 'ruin',
          ruinShape: shapes[(Math.random() * shapes.length) | 0],
          sc, x: cx0 + Math.cos(ang) * r, z: cz0 + Math.sin(ang) * r,
          y: topY, vx: 0, vy: 0, vz: 0,
          born: curT,               // 出生时间：生成后透明度渐入，丝滑出现
          // 微倾：倾角决定顶面坡度，够缓才爬得上去
